_target_: egoallo.config.inference.defaults.InferenceConfig

start_index: 0
traj_length: 128
num_samples: 1
batch_size: 1
smpl_family_model_basedir:
  _target_: pathlib.Path
  _args_:
    - assets/smpl_based_model/
smpl_family_meta_model_name: SmplModelAADecomp
